name: Publish Firefox
run-name: Firefox ${{ inputs.operation }} ${{ inputs.tag }}

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      operation:
        required: false
        default: submit
        type: string
      source_run_id:
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish
        required: true
        type: string
      operation:
        description: Submit to AMO, recover a persisted prerelease XPI, or sync an approved stable XPI
        required: true
        default: submit
        type: choice
        options:
          - submit
          - sync-signed-xpi
          - recover-prerelease-xpi
      source_run_id:
        description: Prior Firefox workflow run containing the prerelease XPI artifact
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: firefox-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: firefox-addons
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: refs/tags/${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate tag and operation
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          OPERATION: ${{ inputs.operation }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $RELEASE_TAG" >&2
            exit 1
          fi
          tag_version="${RELEASE_TAG#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          if [[ "${tag_version%%-*}" != "$manifest_version" ]]; then
            echo "Tag $RELEASE_TAG does not match manifest version $manifest_version" >&2
            exit 1
          fi
          prerelease=false
          if [[ "$tag_version" == *-* ]]; then prerelease=true; fi
          if [[ "$OPERATION" == "sync-signed-xpi" && "$prerelease" == "true" ]]; then
            echo "Only stable AMO versions can be synced from the public API" >&2
            exit 1
          fi
          if [[ "$OPERATION" == "recover-prerelease-xpi" ]]; then
            if [[ "$prerelease" != "true" || ! "$SOURCE_RUN_ID" =~ ^[1-9][0-9]*$ ]]; then
              echo "Prerelease recovery requires a prerelease tag and numeric source run ID" >&2
              exit 1
            fi
          fi
          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "manifest_version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Generate Firefox target
        if: inputs.operation == 'submit'
        run: node tools/build-extension.cjs firefox

      - name: Lint Firefox extension
        if: inputs.operation == 'submit'
        run: npx --yes web-ext@10.5.0 lint --source-dir build/firefox

      - name: Check AMO credentials
        if: inputs.operation == 'submit'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: test -n "$WEB_EXT_API_KEY" && test -n "$WEB_EXT_API_SECRET"

      - name: Submit stable version to AMO
        if: inputs.operation == 'submit' && steps.release.outputs.prerelease == 'false'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        run: >-
          npx --yes web-ext@10.5.0 sign
          --source-dir build/firefox
          --channel listed
          --amo-metadata .github/amo-metadata.json
          --approval-timeout 0
          --no-input

      - name: Sign prerelease for self-distribution
        id: unlisted
        if: inputs.operation == 'submit' && steps.release.outputs.prerelease == 'true'
        env:
          WEB_EXT_API_KEY: ${{ secrets.AMO_API_KEY }}
          WEB_EXT_API_SECRET: ${{ secrets.AMO_API_SECRET }}
        shell: bash
        run: |
          npx --yes web-ext@10.5.0 sign \
            --source-dir build/firefox \
            --channel unlisted \
            --artifacts-dir web-ext-artifacts \
            --approval-timeout 900000 \
            --no-input
          shopt -s nullglob
          xpis=(web-ext-artifacts/*.xpi)
          if [[ "${#xpis[@]}" -ne 1 ]]; then
            echo "Expected one signed XPI, found ${#xpis[@]}" >&2
            exit 1
          fi
          echo "xpi=${xpis[0]}" >> "$GITHUB_OUTPUT"

      - name: Persist signed prerelease XPI
        if: steps.unlisted.outputs.xpi != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: firefox-xpi-${{ inputs.tag }}
          path: ${{ steps.unlisted.outputs.xpi }}
          if-no-files-found: error
          retention-days: 30

      - name: Recover signed prerelease XPI
        id: recovered
        if: inputs.operation == 'recover-prerelease-xpi'
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          mkdir -p web-ext-artifacts
          gh run download "$SOURCE_RUN_ID" \
            --name "firefox-xpi-${{ inputs.tag }}" \
            --dir web-ext-artifacts
          shopt -s nullglob
          xpis=(web-ext-artifacts/*.xpi)
          if [[ "${#xpis[@]}" -ne 1 ]]; then
            echo "Expected one recovered XPI, found ${#xpis[@]}" >&2
            exit 1
          fi
          unzip -t "${xpis[0]}"
          echo "xpi=${xpis[0]}" >> "$GITHUB_OUTPUT"

      - name: Download approved stable XPI from AMO
        id: amo
        if: inputs.operation == 'sync-signed-xpi'
        shell: bash
        run: |
          mkdir -p web-ext-artifacts
          api_url="https://addons.mozilla.org/api/v5/addons/addon/mireki%40antho.dev/versions/${{ steps.release.outputs.manifest_version }}/"
          curl --fail --silent --show-error --location "$api_url" --output /tmp/amo-version.json
          file_url="$(node - <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('/tmp/amo-version.json'));
          if (version.channel !== 'listed' || version.file?.status !== 'public' || !version.reviewed) process.exit(1);
          const url = new URL(version.file.url);
          if (url.origin !== 'https://addons.mozilla.org' || !url.pathname.endsWith('.xpi')) process.exit(1);
          process.stdout.write(url.href);
          NODE
          )"
          output="web-ext-artifacts/mireki-${{ steps.release.outputs.manifest_version }}.xpi"
          curl --fail --silent --show-error --location "$file_url" --output "$output"
          unzip -t "$output"
          echo "xpi=$output" >> "$GITHUB_OUTPUT"

      - name: Upload signed prerelease XPI to GitHub
        if: steps.unlisted.outputs.xpi != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ steps.unlisted.outputs.xpi }}#Signed Firefox extension" --clobber

      - name: Upload recovered prerelease XPI to GitHub
        if: steps.recovered.outputs.xpi != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ steps.recovered.outputs.xpi }}#Signed Firefox extension" --clobber

      - name: Upload approved stable XPI to GitHub
        if: steps.amo.outputs.xpi != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" "${{ steps.amo.outputs.xpi }}#Signed Firefox extension" --clobber
