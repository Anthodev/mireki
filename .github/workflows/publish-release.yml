name: Publish signed release
run-name: Publish ${{ inputs.tag }}

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Stable tag whose AMO version has been approved
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.tag }}

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate stable tag
        id: release
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected a stable tag, got: $RELEASE_TAG" >&2
            exit 1
          fi
          version="$(node -p "require('./manifest.json').version")"
          if [[ "v$version" != "$RELEASE_TAG" ]]; then
            echo "Tag $RELEASE_TAG does not match manifest version $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Download Mozilla-signed XPI from AMO
        id: amo
        shell: bash
        run: |
          mkdir -p web-ext-artifacts
          api_url="https://addons.mozilla.org/api/v5/addons/addon/mireki%40antho.dev/versions/${{ steps.release.outputs.version }}/"
          curl --fail --silent --show-error --location "$api_url" --output /tmp/amo-version.json
          file_url="$(node - <<'NODE'
          const fs = require('node:fs');
          const version = JSON.parse(fs.readFileSync('/tmp/amo-version.json'));
          if (version.file?.is_mozilla_signed_extension !== true) process.exit(1);
          const url = new URL(version.file.url);
          if (url.protocol !== 'https:') process.exit(1);
          process.stdout.write(url.href);
          NODE
          )"
          output="web-ext-artifacts/mireki-${{ steps.release.outputs.version }}.xpi"
          curl --fail --silent --show-error --location "$file_url" --output "$output"
          unzip -t "$output"
          echo "xpi=$output" >> "$GITHUB_OUTPUT"

      - name: Upload signed XPI and publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          draft="$(gh release view "$RELEASE_TAG" --json isDraft --jq '.isDraft')"
          if [[ "$draft" != "true" ]]; then
            echo "GitHub release $RELEASE_TAG is not a draft" >&2
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${{ steps.amo.outputs.xpi }}#Signed Firefox extension" --clobber
          gh release edit "$RELEASE_TAG" --draft=false --prerelease=false --latest
