name: Release
run-name: Release ${{ github.ref_name }}

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out tagged revision
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24

      - name: Validate tag and manifest version
        id: release
        shell: bash
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(alpha|beta|rc)\.[0-9]+)?$ ]]; then
            echo "Unsupported release tag: $tag" >&2
            exit 1
          fi

          tag_version="${tag#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"
          base_version="${tag_version%%-*}"
          if [[ "$base_version" != "$manifest_version" ]]; then
            echo "Tag base $base_version does not match manifest version $manifest_version" >&2
            exit 1
          fi

          git merge-base --is-ancestor "$GITHUB_SHA" origin/develop || {
            echo "Tagged commit must belong to develop" >&2
            exit 1
          }

          if [[ "$tag_version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi

          echo "version=$tag_version" >> "$GITHUB_OUTPUT"
          echo "manifest-version=$manifest_version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Run tests
        run: node --test

      - name: Check JavaScript syntax
        run: find auth background config content options playback popup providers services shared trakt -name '*.js' -print0 | xargs -0 -n1 node --check
      - name: Check build script syntax
        run: node --check tools/build-extension.cjs


      - name: Check manifest assets
        run: node -e "const fs=require('node:fs'); const m=JSON.parse(fs.readFileSync('manifest.json')); for(const p of [m.action.default_popup,...Object.values(m.icons),...m.background.scripts,...m.content_scripts.flatMap(x=>x.js)]) fs.accessSync(p)"
      - name: Generate browser targets
        run: node tools/build-extension.cjs


      - name: Lint Firefox extension
        run: npx --yes web-ext@10.5.0 lint --source-dir build/firefox

      - name: Build browser packages
        shell: bash
        run: |
          npx --yes web-ext@10.5.0 build \
            --source-dir build/firefox \
            --artifacts-dir web-ext-artifacts \
            --filename "mireki-firefox-${{ steps.release.outputs.version }}.zip" \
            --overwrite-dest
          npx --yes web-ext@10.5.0 build \
            --source-dir build/chrome \
            --artifacts-dir web-ext-artifacts \
            --filename "mireki-chrome-${{ steps.release.outputs.version }}.zip" \
            --overwrite-dest
          unzip -t "web-ext-artifacts/mireki-firefox-${{ steps.release.outputs.version }}.zip"
          unzip -t "web-ext-artifacts/mireki-chrome-${{ steps.release.outputs.version }}.zip"



      - name: Generate release notes
        shell: bash
        run: |
          previous_tag="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "$GITHUB_SHA^" 2>/dev/null || true)"
          if [[ -n "$previous_tag" ]]; then
            range="$previous_tag..$GITHUB_SHA"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/compare/$previous_tag...$GITHUB_REF_NAME"
          else
            range="$GITHUB_SHA"
            changelog_url="https://github.com/$GITHUB_REPOSITORY/commits/$GITHUB_REF_NAME"
          fi

          {
            printf '## Changes\n\n'
            git log --first-parent --format='- %s (`%h`)' "$range"
            printf '\n\n**Full changelog**: %s\n' "$changelog_url"
          } > release-notes.md

      - name: Create GitHub release draft
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          options=(--draft)
          if [[ "${{ steps.release.outputs.prerelease }}" == "true" ]]; then
            options+=(--prerelease)
          fi
          gh release create "$GITHUB_REF_NAME" \
            "web-ext-artifacts/mireki-firefox-${{ steps.release.outputs.version }}.zip#Firefox extension ZIP (temporary manual loading)" \
            "web-ext-artifacts/mireki-chrome-${{ steps.release.outputs.version }}.zip#Chrome extension ZIP (developer mode)" \
            "${options[@]}" \
            --notes-file release-notes.md \
            --verify-tag

  publish-firefox:
    needs: release
    permissions:
      contents: write
    uses: ./.github/workflows/publish-firefox.yml
    with:
      tag: ${{ github.ref_name }}
      operation: submit
    secrets: inherit

  publish-chrome:
    needs: release
    if: vars.ENABLE_CHROME_PUBLISH == 'true' && !contains(github.ref_name, '-')
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/publish-chrome.yml
    with:
      tag: ${{ github.ref_name }}
      operation: upload-and-submit
    secrets: inherit
